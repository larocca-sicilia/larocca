<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"
     role="img" aria-labelledby="t d"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Anfahrtsskizze zur Abholung</title>
  <desc id="d">Von der Offenbacher Landstrasse in die Strasse Auf das Loh einbiegen,
  am REWE vorbei, dann links auf den Betriebshof Tunc Trans. Die Abholung ist
  hinten links auf dem Hof.</desc>

  <rect width="800" height="800" fill="#F3EFE2"/>

  <g fill="#E6D9C6">
    <rect x="0" y="688" width="800" height="52"/>
    <rect x="368" y="252" width="52" height="436"/>
    <rect x="200" y="252" width="168" height="44"/>
  </g>
  <line x1="0" y1="714" x2="800" y2="714" stroke="#F3EFE2" stroke-width="3" stroke-dasharray="20 16"/>

  <g stroke="#D9C6AC" stroke-width="2">
    <rect x="60" y="310" width="290" height="300" rx="12" fill="#EAE0CE"/>
    <rect x="480" y="500" width="230" height="120" rx="12" fill="#EAE0CE"/>
    <rect x="480" y="120" width="230" height="104" rx="12" fill="#EAE0CE"/>
  </g>

  <text x="80" y="348" font-size="23" fill="#8A7254">Betriebshof</text>
  <text x="80" y="376" font-size="23" fill="#8A7254" font-weight="700">Tunc Trans</text>
  <text x="595" y="574" font-size="32" font-weight="700" fill="#998264" text-anchor="middle">REWE</text>
  <text x="595" y="162" font-size="22" fill="#8A7254" text-anchor="middle">Bauhof Hainstadt</text>
  <text x="595" y="192" font-size="20" fill="#B0906A" text-anchor="middle">hier zu weit</text>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="6.5" refY="5"
            markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M 0.5 0.5 L 9.5 5 L 0.5 9.5 z" fill="#C44E00"/>
    </marker>
  </defs>

  <g fill="none" stroke="#C44E00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 792 714 L 394 714 L 394 274 L 230 274 L 230 424" marker-end="url(#p)"/>
    <path d="M 700 714 L 664 714" marker-end="url(#p)"/>
    <path d="M 394 560 L 394 524" marker-end="url(#p)"/>
  </g>

  <circle cx="230" cy="452" r="15" fill="#FFFFFF" stroke="#A8352A" stroke-width="7"/>
  <rect x="104" y="482" width="252" height="56" rx="12" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5"/>
  <text x="230" y="518" font-size="26" font-weight="700" fill="#C44E00" text-anchor="middle">La Rocca</text>

  <g>
    <circle cx="394" cy="714" r="25" fill="#C44E00" stroke="#F3EFE2" stroke-width="3"/>
    <text x="394" y="724" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="394" cy="274" r="25" fill="#C44E00" stroke="#F3EFE2" stroke-width="3"/>
    <text x="394" y="284" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <text x="20" y="772" font-size="24" fill="#6B5944">Offenbacher Landstra&#223;e</text>
  <text x="0" y="0" font-size="23" fill="#6B5944"
        transform="translate(452 430) rotate(-90)" text-anchor="middle">Auf das Loh</text>
  <text x="780" y="44" font-size="18" fill="#A9937A" text-anchor="end">Skizze, nicht ma&#223;stabsgetreu</text>
</svg>
