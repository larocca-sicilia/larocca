  <!--
     Der App Code steht BEWUSST NICHT in dieser Datei, sondern hinter dem
     # in deinem eigenen Link. Alles hinter dem # schickt der Browser nie
     an einen Server - es steht in keinem Protokoll und in keinem Repo.

     Dein Link für den Home-Bildschirm:
         https://larocca-sicilia.de/nachtrag.html#DEINAPPCODE
  -->
  <script>
    var roh = location.hash.slice(1);
    var code = '';
    try { code = decodeURIComponent(roh); } catch (e) { code = roh; }
    code = code.trim();

    if (code) {
      location.replace(
        'https://script.google.com/macros/s/' +
        'AKfycbwqmzzx5abuDxQo4bh8SDc72g_uyU2PuiguBdLNrqLWCYlBJ-joYypsgjv00tu_-9lT' +
        '/exec?nach=' + encodeURIComponent(code)
      );
    } else {
      document.getElementById('text').innerHTML =
        '<b>Kein Code im Link.</b><br>' +
        'Richtig ist: …/nachtrag.html<b>#DEINCODE</b>';
    }
  </script>
